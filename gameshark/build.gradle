plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.80'
}

version = '2.0.0-local.8'
group = 'local.gameshark'
base.archivesName = 'gameshark-local'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

neoForge {
    version = '21.1.265'
    runs {
        client { client(); gameDirectory = project.file('runs/client') }
    }
    mods { gameshark { sourceSet sourceSets.main } }
}

dependencies {
    compileOnly files('libs/Pixelmon-1.21.1-9.4.2-universal.jar')
}
