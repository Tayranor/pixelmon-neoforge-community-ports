modLoader="javafml"
loaderVersion="${loader_version_range}"
license="Copyright ${copyright_year} Waterdude Studios Ltd ${mod_license}"
issueTrackerURL="${issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Tayranor/pixelmon-neoforge-community-ports"
logoFile="${mod_id}.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_desc}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pixelmon"
type="optional"
versionRange="[${pixelmon_version},)"
ordering="AFTER"
side="SERVER"

[[mixins]]
config="mixins.${mod_id}.json"
